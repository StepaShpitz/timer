<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Семейный бюджет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Same look as the game: Flowbite default palette, Inter, 12px radius */
:root{color-scheme:light;
  --bg:#f9fafb; --surface:#ffffff; --ink:#101828; --muted:#6a7282; --line:#e5e7eb; --plain:#f3f4f6;
  --blue:#1447e6; --red:#c70036; --ok:#007a55; --warn:#f54900;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s0:#9ca3af;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --radius:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#101828; --surface:#1e2939; --ink:#ffffff; --muted:#99a1af; --line:#364153; --plain:#1a2333;
  --blue:#2b7fff; --red:#ff2056; --ok:#00bc7d; --warn:#ff8904;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#6a7282}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#101828; --surface:#1e2939; --ink:#ffffff; --muted:#99a1af; --line:#364153; --plain:#1a2333;
  --blue:#2b7fff; --red:#ff2056; --ok:#00bc7d; --warn:#ff8904;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#6a7282}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
h2{margin:0 0 12px;font-size:1rem;font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 2px rgba(16,24,40,.05);min-width:0}

/* buttons and inputs: soft style from the game panel */
button{font:500 .875rem/1.25rem var(--body);padding:9px 14px;border-radius:var(--radius);border:1px solid var(--line);
  background:transparent;color:var(--ink);cursor:pointer;transition:background-color .15s,border-color .15s}
button:hover:not(:disabled){background:color-mix(in srgb,var(--blue) 10%,transparent);border-color:color-mix(in srgb,var(--blue) 30%,var(--line))}
button.primary,button.on{background:color-mix(in srgb,var(--blue) 14%,transparent);border-color:color-mix(in srgb,var(--blue) 38%,var(--line))}
button.primary:hover:not(:disabled){background:color-mix(in srgb,var(--blue) 22%,transparent)}
button.danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
button.icon{padding:6px 10px;line-height:1}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 30%,transparent)}
input,select{font:400 .9rem/1.25rem var(--body);color:var(--ink);background:var(--plain);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input:focus,select:focus{border-color:var(--blue)}
input.amt{text-align:right;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.02em}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav .m{min-width:150px;text-align:center;font-weight:600}
@media (max-width:480px){.monthnav{flex-wrap:wrap}.monthnav .m{min-width:0;padding:0 4px}.pill{padding:6px 8px}}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.tabs button{border-color:transparent;border-radius:9px}
.bar-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* quick add */
.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.add>label{min-width:0}.add input,.add select{width:100%}
.add .wide{grid-column:span 2}
.add .full{grid-column:1/-1}
.seg{display:inline-flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:10px;justify-self:start}
.seg button{border-color:transparent;padding:6px 14px;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .l{font-size:.75rem;font-weight:600;color:var(--muted);margin-right:2px}
.chips button{padding:5px 11px;font-size:.82rem;border-radius:999px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi.good .v{color:var(--ok)}
/* module cards */
.blist{display:flex;flex-direction:column;gap:10px}
.blist .meter{height:8px;margin-top:5px}
.badge{display:inline-block;font-size:.72rem;font-weight:500;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--blue) 10%,transparent);color:var(--ink);margin-left:4px;white-space:nowrap}
.rrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .t{min-width:0}.rrow .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow small{color:var(--muted)}
.paid{color:var(--ok);font-size:.85rem;font-weight:600;white-space:nowrap}
.late{color:var(--red)}
.redit{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(130px,1.3fr) 100px 70px minmax(110px,1fr) minmax(110px,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.redit input,.redit select{width:100%;padding:7px 10px}
.redit.hd{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.03em;padding-top:0}
@media (max-width:760px){.redit{grid-template-columns:1fr 1fr}.redit.hd{display:none}.redit>:first-child{grid-column:1/-1}}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.goal .meter{height:12px;margin:10px 0 6px}
.goal .act{display:flex;gap:8px;margin-top:12px}.goal .act input{flex:1;min-width:0}
.gadd{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.gadd input{width:100%}
table.heat td,table.heat th{white-space:nowrap}
table.heat td.v{text-align:right;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--s1) var(--a),transparent)}
table.heat tr.sum td{font-weight:700}
.mods{display:flex;flex-direction:column;gap:8px}
.mods label{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;font-size:.9rem;cursor:pointer}
.mods input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--blue)}
.mods small{display:block;color:var(--muted);font-size:.8rem}
.ledit{display:flex;flex-direction:column;gap:6px}
.ledit div{display:flex;gap:6px}.ledit input{flex:1;min-width:0;padding:7px 10px}
.kpi .l{font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.over .v{color:var(--red)}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

/* category rows (accordion like the game's rules) */
.acc{padding:0;overflow:hidden}
.acc .hd{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.acc details{border-top:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;padding:12px 18px;transition:background-color .15s}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.acc details[open]>summary{background:color-mix(in srgb,var(--blue) 8%,transparent)}
.row1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.row1 .nm{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.row1 .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:12px;height:12px;flex:none;fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;transform:rotate(180deg);transition:transform .2s}
details[open] .chev{transform:none}
.dot{width:10px;height:10px;border-radius:3px;flex:none;background:var(--c)}
.meter{position:relative;height:10px;margin-top:8px;border-radius:4px;background:var(--plain)}
.meter i{position:absolute;top:0;bottom:0;left:0;border-radius:4px;background:var(--c)}
.meter i.ov{background:var(--red);border-left:2px solid var(--surface);border-radius:0 4px 4px 0}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.subs{padding:4px 18px 14px 36px;display:flex;flex-direction:column;gap:10px}
.subs .meter{height:6px;margin-top:5px}
.subs .row1{font-size:.88rem}
.over{color:var(--red);font-weight:600}
.left{color:var(--ok)}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:.85rem}
.legend div{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.legend .p{color:var(--muted);min-width:38px;text-align:right}
.keys{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{display:inline-block;width:12px;height:10px;border-radius:3px;background:var(--s1)}
.keys i.tick{width:12px;height:2px;background:var(--ink);opacity:.6}
.hit{cursor:default}
.hit:hover{opacity:.82}
.empty{padding:20px 0;text-align:center;color:var(--muted);font-size:.9rem}

/* budget table */
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th.r,td.r{text-align:right}
tr.cat td{font-weight:600;background:color-mix(in srgb,var(--ink) 3%,transparent);padding-top:10px;padding-bottom:10px}
tr.tot td{font-weight:700;border-bottom:0}
td input.amt{width:110px;padding:6px 10px}
td input.name{width:100%;padding:6px 10px}
.tbl{overflow-x:auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}

/* transactions */
.day{font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.02em;padding:12px 0 4px}
.tx{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tx .t{min-width:0}
.tx .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t small{color:var(--muted)}

/* tooltip and modal from the game */
.tip{position:fixed;z-index:60;max-width:260px;padding:8px 12px;border-radius:8px;pointer-events:none;background:#1e2939;color:#fff;
  font:500 .82rem/1.35 var(--body);box-shadow:0 4px 12px rgba(3,7,18,.25);opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip .sub{display:block;color:#d1d5dc;font-weight:400}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tip{background:#364153}}
:root[data-theme="dark"] .tip{background:#364153}
.overlay{position:fixed;inset:0;z-index:50;padding:16px;background:rgba(3,7,18,.6);display:flex;align-items:center;justify-content:center}
.card{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 20px 40px rgba(3,7,18,.3);display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:1.2rem;font-weight:600}
.card p{margin:0;font-size:.9rem;color:var(--muted)}
.card .btns{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:#1e2939;color:#fff;padding:10px 16px;border-radius:10px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
.pill{font-size:.78rem;padding:6px 10px;color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--red)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.gate .card{box-shadow:0 1px 2px rgba(16,24,40,.05)}
.err{color:var(--red);font-size:.85rem}
.adv summary{cursor:pointer;font-size:.85rem;color:var(--muted);list-style:none}
.adv summary::-webkit-details-marker{display:none}
.adv[open]{display:flex;flex-direction:column;gap:10px}
.users{display:flex;flex-direction:column;gap:6px}
.users div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;font-size:.9rem}
.uadd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
@media (max-width:420px){.uadd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.uadd button{grid-column:1/-1}}
.card hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.card h4{margin:0;font-size:.95rem;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Семейный бюджет</h1>
    <div class="monthnav">
      <button class="icon" id="prev" aria-label="Предыдущий месяц">‹</button>
      <div class="m" id="mlabel"></div>
      <button class="icon" id="next" aria-label="Следующий месяц">›</button>
      <button class="icon" id="settings" title="Настройки" aria-label="Настройки">⚙</button>
      <button class="icon pill" id="sync" hidden></button>
    </div>
  </header>

  <form class="box add" id="addf" autocomplete="off">
    <div class="seg full" id="a-kind" hidden><button type="button" data-kind="exp">Трата</button><button type="button" data-kind="inc">Доход</button></div>
    <label class="f">Сумма<input class="amt" id="a-amt" inputmode="decimal" placeholder="0,00" required></label>
    <label class="f"><span id="a-sub-l">Статья</span><select id="a-sub" required></select></label>
    <label class="f" id="a-tag-w" hidden>Для кого<select id="a-tag"></select></label>
    <label class="f" id="a-pay-w" hidden>Чем платили<select id="a-pay"></select></label>
    <label class="f">Дата<input type="date" id="a-date" required></label>
    <label class="f wide">Комментарий<input id="a-note" placeholder="необязательно"></label>
    <button class="primary" type="submit" id="a-btn">Добавить трату</button>
    <div class="chips full" id="quick" hidden></div>
  </form>

  <div class="bar-top">
    <div class="tabs" role="tablist">
      <button data-tab="overview">Обзор</button>
      <button data-tab="budget">Бюджет</button>
      <button data-tab="tx">Траты</button>
      <button data-tab="rec" data-mod="rec">Регулярные</button>
      <button data-tab="goals" data-mod="goals">Цели</button>
      <button data-tab="year" data-mod="year">Год</button>
    </div>
  </div>

  <main id="view"></main>
</div>
<div class="gate" id="gate" hidden>
  <form class="card" id="loginf" autocomplete="on">
    <h3>Семейный бюджет</h3>
    <p>Войдите, чтобы видеть общие траты семьи и вносить новые.</p>
    <label class="f">Логин<input id="l-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="f">Пароль<input id="l-pass" name="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="l-err" hidden></div>
    <button class="primary" type="submit" id="l-btn">Войти</button>
    <details class="adv"><summary>Вход по ключу GitHub</summary>
      <label class="f">Репозиторий<input id="k-repo" value="StepaShpitz/budget-data"></label>
      <label class="f">Ключ доступа<input id="k-token" type="password" placeholder="github_pat_…" autocomplete="off"></label>
      <button type="button" id="k-btn">Войти по ключу</button>
    </details>
  </form>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
// ===== Storage: data lives only in this browser (later can be swapped for a server, like the game's Store) =====
const KEY = 'fam.budget.v1';
const Store = {
  load(k){ try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch(e){ return null; } },
  save(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
const uid = () => Math.random().toString(36).slice(2, 9);
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MON_S = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

function defaults(){
  let ci = 0; // fixed ids, so devices started separately still share sections
  const C = (name, subs) => { const c = 'c' + ci++; return { id: c, name, subs: subs.map((n, i) => ({ id: c + 's' + i, name: n })) }; };
  return { v: 1, cur: '€', plans: {}, tx: [], inc: [], rec: [], goals: [], gc: [], cfg: defaultCfg(), del: {}, ts: {}, cats: [
    C('Дом', ['Аренда / ипотека','Электричество','Вода','Интернет и связь','Ремонт и быт']),
    C('Продукты', ['Супермаркет','Рынок','Хозтовары']),
    C('Дети', ['Школа','Сад','Кружки и секции','Одежда и обувь','Игрушки и прочее']),
    C('Машины', ['Машина 1 — топливо','Машина 2 — топливо','Страховка и налоги','Сервис и ремонт','Парковка и мойка']),
    C('Собака', ['Корм','Ветеринар','Груминг и прочее']),
    C('Здоровье', ['Аптека','Врачи']),
    C('Отдых', ['Кафе и доставка','Развлечения','Поездки','Подарки']),
    C('Прочее', ['Одежда взрослых','Подписки','Разное'])
  ]};
}

// Optional modules and their lists; synced as one block (last edit wins)
function defaultCfg(){
  const L = (p, names) => names.map((name, i) => ({ id: p + (i + 1), name }));
  return { mods: { inc: true, rec: true, tags: true, pay: true, goals: true, quick: true, year: true, xls: true },
    tags: L('t', ['Ребёнок 1', 'Ребёнок 2', 'Ребёнок 3', 'Машина 1', 'Машина 2', 'Собака', 'Родители']),
    pays: L('p', ['Карта', 'Наличные']),
    incs: L('i', ['Зарплата', 'Подработка', 'Прочее']) };
}
const LISTS = ['tx', 'inc', 'rec', 'goals', 'gc'];
function normalize(d){
  d.del = d.del || {}; d.ts = d.ts || {}; d.plans = d.plans || {};
  for (const k of LISTS) d[k] = Array.isArray(d[k]) ? d[k] : [];
  const dc = defaultCfg(); d.cfg = d.cfg || dc;
  d.cfg.mods = { ...dc.mods, ...(d.cfg.mods || {}) };
  for (const k of ['tags', 'pays', 'incs']) if (!Array.isArray(d.cfg[k])) d.cfg[k] = dc[k];
  return d;
}
let D = normalize(Store.load(KEY) || defaults());
const now = new Date();
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
let M = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
let TAB = 'overview', EDIT = false, FILTER = '', KIND = 'exp';
const on = k => !!D.cfg.mods[k];
const byId = (list, id) => list.find(x => x.id === id);
const nameOf = (list, id) => { const x = byId(list, id); return x ? x.name : ''; };
// kind marks what changed, so two phones can merge their edits: tx by id, plans per month, sections as a whole
const save = kind => {
  const n = Date.now(); D.ts = D.ts || {};
  if (kind === 'cats') D.ts.cats = n;
  else if (kind === 'cfg') D.ts.cfg = n;
  else if (kind === 'plan') D.ts['p' + M] = n;
  else if (kind === 'all') { D.ts.cats = n; D.ts.cfg = n; for (const m in D.plans) D.ts['p' + m] = n; }
  if (!Store.save(KEY, D)) toast('Не удалось сохранить в браузере');
  Sync.later();
};

// ===== Helpers =====
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('ru-RU', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }).format(Math.round(n*100)/100) + ' ' + D.cur;
const parseAmt = s => { const v = parseFloat(String(s).replace(/\s/g,'').replace(',', '.')); return isFinite(v) ? Math.round(v*100)/100 : NaN; };
const shiftMonth = (m, d) => { let [y, mo] = m.split('-').map(Number); mo += d; while (mo < 1) { mo += 12; y--; } while (mo > 12) { mo -= 12; y++; } return `${y}-${pad(mo)}`; };
const mLabel = m => { const [y, mo] = m.split('-').map(Number); return `${MONTHS[mo-1]} ${y}`; };
const color = i => i < 8 ? `var(--s${i+1})` : 'var(--s0)';
const subIndex = () => { const ix = {}; D.cats.forEach((c, ci) => c.subs.forEach(s => ix[s.id] = { s, c, ci })); return ix; };

function factBySub(m){ const r = {}; for (const t of D.tx) if (t.date.startsWith(m)) r[t.sub] = (r[t.sub] || 0) + t.amt; return r; }
function planOf(m){ return D.plans[m] || {}; }
function catTotals(m){
  const f = factBySub(m), p = planOf(m);
  return D.cats.map((c, ci) => {
    const subs = c.subs.map(s => ({ ...s, fact: f[s.id] || 0, plan: +p[s.id] || 0 }));
    return { ...c, ci, subs, fact: subs.reduce((a, s) => a + s.fact, 0), plan: subs.reduce((a, s) => a + s.plan, 0) };
  });
}

// ===== Tooltip =====
const tip = $('tip');
function showTip(html, e){
  tip.innerHTML = html; tip.classList.add('show');
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
document.addEventListener('mousemove', e => { const h = e.target.closest('[data-tip]'); if (h) showTip(h.dataset.tip, e); else tip.classList.remove('show'); });
document.addEventListener('scroll', () => tip.classList.remove('show'), true);
let toastT; function toast(s){ const t = $('toast'); t.textContent = s; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

// ===== Header, quick add =====
function opts(list, first){ return (first != null ? `<option value="">${first}</option>` : '') + list.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join(''); }
function subOpts(){ return D.cats.map(c => `<optgroup label="${esc(c.name)}">${c.subs.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</optgroup>`).join(''); }
function renderHead(){
  if (!on('inc')) KIND = 'exp';
  $('mlabel').textContent = TAB === 'year' ? M.slice(0, 4) + ' год' : mLabel(M);
  document.querySelectorAll('.tabs button').forEach(b => { b.hidden = b.dataset.mod ? !on(b.dataset.mod) : false; b.classList.toggle('on', b.dataset.tab === TAB); });
  $('a-kind').hidden = !on('inc');
  $('a-kind').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.kind === KIND));
  const inc = KIND === 'inc';
  $('a-sub-l').textContent = inc ? 'Источник' : 'Статья';
  $('a-btn').textContent = inc ? 'Добавить доход' : 'Добавить трату';
  const sel = $('a-sub'), keep = sel.value;
  sel.innerHTML = '<option value="" disabled selected>Выберите…</option>' + (inc ? opts(D.cfg.incs) : subOpts());
  if (keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
  const fill = (id, list, first) => { const el = $(id), k = el.value; el.innerHTML = opts(list, first); if ([...el.options].some(o => o.value === k)) el.value = k; };
  $('a-tag-w').hidden = inc || !on('tags'); fill('a-tag', D.cfg.tags, '— вся семья');
  $('a-pay-w').hidden = !on('pay'); fill('a-pay', D.cfg.pays, '—');
  renderQuick();
  const d = $('a-date');
  if (!d.value || !d.value.startsWith(M)) d.value = todayISO().startsWith(M) ? todayISO() : M + '-01';
}
$('addf').addEventListener('submit', e => {
  e.preventDefault();
  const amt = parseAmt($('a-amt').value);
  if (!(amt > 0)) { toast('Введите сумму'); $('a-amt').focus(); return; }
  const date = $('a-date').value, sub = $('a-sub').value;
  if (!sub) { toast(KIND === 'inc' ? 'Выберите источник' : 'Выберите статью'); return; }
  const rec = { id: uid(), date, amt, note: $('a-note').value.trim(), u: Date.now() }, by = Sync.cfg && Sync.cfg.user;
  if (by) rec.by = by;
  if (on('pay') && $('a-pay').value) rec.pay = $('a-pay').value;
  let name;
  if (KIND === 'inc') { rec.src = sub; D.inc.push(rec); name = nameOf(D.cfg.incs, sub); }
  else { rec.sub = sub; if (on('tags') && $('a-tag').value) rec.tag = $('a-tag').value; D.tx.push(rec); name = subIndex()[sub].s.name; }
  save('tx');
  $('a-amt').value = ''; $('a-note').value = '';
  if (!date.startsWith(M)) M = date.slice(0, 7);
  render(); toast(`${KIND === 'inc' ? 'Доход' : '+'} ${fmt(amt)} · ${name}`); $('a-amt').focus();
});
$('a-kind').onclick = e => { const b = e.target.closest('[data-kind]'); if (!b) return; KIND = b.dataset.kind; $('a-sub').value = ''; renderHead(); };

// Quick entry: what the family enters most often, one tap fills the form
function renderQuick(){
  const box = $('quick');
  if (!on('quick') || KIND !== 'exp') { box.hidden = true; return; }
  const ix = subIndex(), since = shiftMonth(todayISO().slice(0, 7), -3), bySub = {}, byPair = {};
  for (const t of D.tx) { if (t.date < since || !ix[t.sub] || t.rec) continue;
    bySub[t.sub] = (bySub[t.sub] || 0) + 1; const k = t.sub + '|' + t.amt; byPair[k] = (byPair[k] || 0) + 1; }
  const top = Object.entries(bySub).sort((a, b) => b[1] - a[1]).slice(0, 6);
  if (!top.length) { box.hidden = true; return; }
  box.innerHTML = '<span class="l">Часто:</span>' + top.map(([sub]) => {
    const pair = Object.entries(byPair).filter(([k, n]) => k.startsWith(sub + '|') && n >= 2).sort((a, b) => b[1] - a[1])[0];
    const amt = pair ? +pair[0].split('|')[1] : '';
    return `<button type="button" data-qs="${sub}" data-qa="${amt}">${esc(ix[sub].s.name)}${amt ? ' · ' + esc(fmt(amt)) : ''}</button>`;
  }).join('');
  box.hidden = false;
}
$('quick').onclick = e => { const b = e.target.closest('[data-qs]'); if (!b) return;
  $('a-sub').value = b.dataset.qs; if (b.dataset.qa) $('a-amt').value = String(b.dataset.qa).replace('.', ',');
  $('a-amt').focus(); $('a-amt').select(); };

// ===== Overview =====
function meter(fact, plan, scale, tick = true){
  const w = v => (scale ? Math.min(100, v / scale * 100) : 0).toFixed(2) + '%';
  if (!plan) return `<div class="meter"><i style="width:${w(fact)}"></i></div>`;
  const within = Math.min(fact, plan), over = Math.max(0, fact - plan);
  return `<div class="meter" style="background:linear-gradient(90deg,color-mix(in srgb,var(--c) 18%,var(--plain)) ${w(plan)},var(--plain) 0)">` +
    `<i style="width:${w(within)}"></i>` + (over ? `<i class="ov" style="left:${w(plan)};width:calc(${w(fact)} - ${w(plan)})"></i>` : '') +
    (tick ? `<b style="left:calc(${w(plan)} - 1px)"></b>` : '') + `</div>`;
}
function rest(fact, plan){
  if (!plan) return fact ? `<span class="num">${fmt(fact)}</span>` : '<span class="muted">—</span>';
  const d = plan - fact;
  return `<span class="num">${fmt(fact)} <span class="muted">из ${fmt(plan)}</span></span>`;
}
function renderOverview(){
  const cats = catTotals(M);
  const plan = cats.reduce((a, c) => a + c.plan, 0), fact = cats.reduce((a, c) => a + c.fact, 0);
  const left = plan - fact;
  // pace: how much of the month has passed (only for the current month)
  const [y, mo] = M.split('-').map(Number), days = new Date(y, mo, 0).getDate();
  const isNow = M === todayISO().slice(0, 7);
  const passed = isNow ? new Date().getDate() / days : (M < todayISO().slice(0, 7) ? 1 : 0);
  // forecast: each line ends at its plan, or at what is already spent if that is more; lines without a plan count as spent
  const forecast = passed >= 1 ? fact : cats.reduce((a, c) => a + c.subs.reduce((b, x) => b + Math.max(x.fact, x.plan), 0), 0);
  const overBy = forecast - plan;
  const scale = Math.max(1, ...cats.map(c => Math.max(c.plan, c.fact)));
  const k = (l, v, s, cls = '') => `<div class="box kpi ${cls}"><div class="l">${l}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`;

  const rows = cats.map(c => {
    const d = c.plan - c.fact;
    const status = c.plan ? (d < 0 ? `<span class="over num">▲ перерасход ${fmt(-d)}</span>` : `<span class="left num">осталось ${fmt(d)}</span>`) : '<span class="muted">без плана</span>';
    const sscale = Math.max(1, ...c.subs.map(s => Math.max(s.plan, s.fact)));
    return `<details style="--c:${color(c.ci)}">
      <summary data-tip="<b>${esc(c.name)}</b><span class=sub>Потрачено ${esc(fmt(c.fact))}${c.plan ? ' · план ' + esc(fmt(c.plan)) : ''}</span>">
        <div class="row1"><div class="nm"><svg class="chev" viewBox="0 0 10 6"><path d="M9 5 5 1 1 5"/></svg><span class="dot"></span><span>${esc(c.name)}</span></div>${rest(c.fact, c.plan)}</div>
        ${meter(c.fact, c.plan, scale)}
        <div class="row1" style="margin-top:4px;font-size:.8rem"><span></span>${status}</div>
      </summary>
      <div class="subs">${c.subs.map(s => `<div><div class="row1"><span>${esc(s.name)}</span>${rest(s.fact, s.plan)}</div>${meter(s.fact, s.plan, sscale)}</div>`).join('')}</div>
    </details>`;
  }).join('');

  return `<div class="col">
    <div class="kpis">
      ${k('План на месяц', fmt(plan), plan ? 'по всем статьям' : 'заполните во вкладке «Бюджет»')}
      ${k('Потрачено', fmt(fact), plan ? Math.round(fact / plan * 100) + '% плана' : D.tx.filter(t => t.date.startsWith(M)).length + ' трат')}
      ${k(left < 0 ? 'Перерасход' : 'Осталось', fmt(Math.abs(left)), left < 0 ? 'сверх плана' : 'до конца плана', left < 0 ? 'over' : '')}
      ${k(passed >= 1 ? 'Итог месяца' : 'Прогноз на месяц', fmt(forecast), passed >= 1 ? 'месяц закончился' : overBy > 0.004 ? `на ${fmt(overBy)} больше плана` : 'если дальше тратить по плану', overBy > 0.004 ? 'over' : '')}
      ${on('inc') ? (() => { const inc = sumInc(M), bal = inc - fact;
        return k('Доходы', fmt(inc), D.inc.filter(t => t.date.startsWith(M)).length + ' поступл.') +
          k(bal < 0 ? 'Минус за месяц' : 'Остаётся', fmt(Math.abs(bal)), bal < 0 ? 'трат больше, чем доходов' : 'доходы минус траты', bal < 0 ? 'over' : inc ? 'good' : ''); })() : ''}
    </div>
    <div class="grid2">
      <div class="box acc"><div class="hd"><h2 style="margin:0">План и факт по разделам</h2><span class="muted" style="font-size:.8rem">нажмите — подразделы</span></div>${rows}</div>
      <div class="col">
        <div class="box chart"><h2>Куда ушли деньги</h2>${donut(cats, fact)}</div>
        <div class="box chart"><h2>Траты за полгода</h2>${trend()}</div>
        ${on('rec') ? recCard() : ''}
        ${on('tags') ? groupCard('Для кого', 'tag', D.cfg.tags, 'вся семья') : ''}
        ${on('pay') ? groupCard('Чем платили', 'pay', D.cfg.pays, 'не указано') : ''}
        ${who()}
        ${on('goals') && D.goals.length ? goalsCard() : ''}
      </div>
    </div>
  </div>`;
}

function donut(cats, total){
  const items = cats.filter(c => c.fact > 0).sort((a, b) => b.fact - a.fact);
  if (!items.length) return '<div class="empty">В этом месяце трат пока нет</div>';
  const R = 80, r = 52, cx = 100, cy = 100, gap = items.length > 1 ? 0.025 : 0;
  let a0 = -Math.PI / 2, paths = '';
  const pt = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
  for (const c of items) {
    const sweep = c.fact / total * Math.PI * 2;
    const s = a0 + gap / 2, e = a0 + sweep - gap / 2;
    const tipHtml = `<b>${esc(c.name)}</b><span class=sub>${esc(fmt(c.fact))} · ${Math.round(c.fact / total * 100)}%</span>`;
    if (items.length === 1) paths += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${color(c.ci)}" stroke-width="${R - r}" class="hit" data-tip="${tipHtml}"/>`;
    else if (e > s) { const big = e - s > Math.PI ? 1 : 0;
      paths += `<path class="hit" data-tip="${tipHtml}" fill="${color(c.ci)}" d="M${pt(R, s)} A${R} ${R} 0 ${big} 1 ${pt(R, e)} L${pt(r, e)} A${r} ${r} 0 ${big} 0 ${pt(r, s)} Z"/>`; }
    a0 += sweep;
  }
  return `<div style="display:flex;justify-content:center"><svg viewBox="0 0 200 200" style="max-width:220px" role="img" aria-label="Структура трат">${paths}
    <text x="100" y="96" text-anchor="middle" font-size="11" fill="var(--muted)">всего</text>
    <text x="100" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${esc(fmt(total))}</text></svg></div>
    <div class="legend">${items.map(c => `<div><span class="dot" style="--c:${color(c.ci)}"></span><span>${esc(c.name)}</span><span class="num">${fmt(c.fact)}</span><span class="p num">${Math.round(c.fact / total * 100)}%</span></div>`).join('')}</div>`;
}

function trend(){
  const ms = [], ix = subIndex(); for (let i = 5; i >= 0; i--) ms.push(shiftMonth(M, -i));
  const data = ms.map(m => { const p = planOf(m); return { m, fact: D.tx.reduce((a, t) => a + (t.date.startsWith(m) ? t.amt : 0), 0), plan: Object.entries(p).reduce((a, [k, v]) => a + (ix[k] ? +v || 0 : 0), 0) }; });
  const max = Math.max(...data.map(d => Math.max(d.fact, d.plan)));
  if (!max) return '<div class="empty">Пока нет данных</div>';
  const L = 52, W = 330, H = 150, top = 14, base = 120, bw = 30, step = (W - L) / 6;
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / p) * p; })();
  const yy = v => base - v / nice * (base - top);
  let g = '';
  for (const f of [0, .5, 1]) g += `<line x1="${L}" x2="${W}" y1="${yy(nice * f)}" y2="${yy(nice * f)}" stroke="var(--line)" stroke-width="1"/>` +
    `<text x="${L - 6}" y="${yy(nice * f) + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${esc(fmt(nice * f))}</text>`;
  data.forEach((d, i) => {
    const x = L + i * step + (step - bw) / 2, h = base - yy(d.fact), mo = +d.m.slice(5) - 1;
    const tipHtml = `<b>${MONTHS[mo]} ${d.m.slice(0, 4)}</b><span class=sub>Потрачено ${esc(fmt(d.fact))}${d.plan ? ' · план ' + esc(fmt(d.plan)) : ''}</span>`;
    g += `<rect class="hit" data-tip="${tipHtml}" x="${L + i * step}" y="${top}" width="${step}" height="${base - top + 20}" fill="transparent"/>`;
    if (h > 0) g += `<path pointer-events="none" fill="${d.plan && d.fact > d.plan ? 'var(--red)' : 'var(--s1)'}" d="M${x} ${base} V${base - h + Math.min(4, h)} q0 -4 4 -4 h${bw - 8} q4 0 4 4 V${base} Z"/>`;
    if (d.plan) g += `<line pointer-events="none" x1="${x - 4}" x2="${x + bw + 4}" y1="${yy(d.plan)}" y2="${yy(d.plan)}" stroke="var(--ink)" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>`;
    g += `<text x="${x + bw / 2}" y="${base + 15}" text-anchor="middle" font-size="10" fill="${d.m === M ? 'var(--ink)' : 'var(--muted)'}" font-weight="${d.m === M ? 600 : 400}">${MON_S[mo]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Траты за последние 6 месяцев">${g}</svg>
    <div class="keys"><span><i></i>Потрачено</span><span><i class="tick"></i>План</span><span><i style="background:var(--red)"></i>Больше плана</span></div>`;
}

// ===== Module cards on the overview =====
const sumInc = m => D.inc.reduce((a, t) => a + (t.date.startsWith(m) ? t.amt : 0), 0);
function blist(items, total){
  const max = Math.max(1, ...items.map(x => x.v));
  return `<div class="blist">${items.map(x => `<div style="--c:${x.c || 'var(--s1)'}"><div class="row1"><span>${esc(x.name)}</span><span class="num">${fmt(x.v)}${total ? ` <span class="muted">${Math.round(x.v / total * 100)}%</span>` : ''}</span></div><div class="meter"><i style="width:${(x.v / max * 100).toFixed(1)}%"></i></div></div>`).join('')}</div>`;
}
function groupCard(title, field, list, none){
  const sums = {}, mt = D.tx.filter(t => t.date.startsWith(M));
  for (const t of mt) sums[t[field] || ''] = (sums[t[field] || ''] || 0) + t.amt;
  const total = mt.reduce((a, t) => a + t.amt, 0);
  if (!total || !list.some(x => sums[x.id])) return '';
  const items = list.filter(x => sums[x.id]).map(x => ({ name: x.name, v: sums[x.id] })).sort((a, b) => b.v - a.v);
  if (sums['']) items.push({ name: none, v: sums[''], c: 'var(--s0)' });
  return `<div class="box"><h2>${title}</h2>${blist(items, total)}</div>`;
}
function who(){
  const sums = {}; for (const t of D.tx) if (t.date.startsWith(M) && t.by) sums[t.by] = (sums[t.by] || 0) + t.amt;
  const names = Object.keys(sums); if (names.length < 2) return '';
  return `<div class="box"><h2>Кто вносил</h2>${blist(names.map(n => ({ name: n, v: sums[n] })).sort((a, b) => b.v - a.v))}</div>`;
}
// ===== Recurring payments =====
const daysIn = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const recDue = m => D.rec.filter(r => (!r.from || r.from <= m) && ix0()[r.sub]).sort((a, b) => (a.day || 1) - (b.day || 1));
const ix0 = () => subIndex();
const recPaid = (r, m) => D.tx.find(t => t.rec === r.id && t.date.startsWith(m));
function recRow(r, m, compact){
  const ix = subIndex(), { s, c, ci } = ix[r.sub], paid = recPaid(r, m), day = Math.min(r.day || 1, daysIn(m));
  const late = !paid && (m < todayISO().slice(0, 7) || (m === todayISO().slice(0, 7) && day < +todayISO().slice(8)));
  return `<div class="rrow"><span class="dot" style="--c:${color(ci)}"></span><div class="t"><div>${esc(r.name || s.name)}</div><div><small class="${late ? 'late' : ''}">${day} ${MON_S[+m.slice(5) - 1]}${late ? ' · просрочено' : ''}${compact ? '' : ' · ' + esc(c.name)}</small></div></div>
    <span class="num">${fmt(paid ? paid.amt : r.amt)}</span>${paid ? '<span class="paid">✓ оплачено</span>' : `<button class="icon" data-payrec="${r.id}">Оплачено</button>`}</div>`;
}
function recCard(){
  const due = recDue(M); if (!due.length) return '';
  const unpaid = due.filter(r => !recPaid(r, M)), left = unpaid.reduce((a, r) => a + r.amt, 0);
  return `<div class="box"><div class="row1" style="margin-bottom:6px"><h2 style="margin:0">Регулярные платежи</h2><span class="muted" style="font-size:.85rem">${due.length - unpaid.length} из ${due.length}</span></div>
    ${unpaid.length ? unpaid.slice(0, 5).map(r => recRow(r, M, true)).join('') + `<div class="row1" style="margin-top:8px;font-size:.85rem"><span class="muted">${unpaid.length > 5 ? `и ещё ${unpaid.length - 5} · ` : ''}осталось оплатить</span><span class="num" style="font-weight:600">${fmt(left)}</span></div>` : '<div class="paid" style="padding:6px 0">Всё оплачено за этот месяц</div>'}</div>`;
}
function payRec(id, m){
  const r = byId(D.rec, id); if (!r || recPaid(r, m)) return false;
  if (!(r.amt > 0)) { toast('Укажите сумму платежа во вкладке «Регулярные»'); return false; }
  const today = todayISO(), day = pad(Math.min(r.day || 1, daysIn(m)));
  const t = { id: uid(), date: m === today.slice(0, 7) ? today : `${m}-${day}`, sub: r.sub, amt: r.amt, note: r.name || '', rec: r.id, u: Date.now() };
  if (Sync.cfg && Sync.cfg.user) t.by = Sync.cfg.user; if (r.tag) t.tag = r.tag; if (r.pay) t.pay = r.pay;
  D.tx.push(t); return true;
}

// ===== Savings goals =====
const goalSaved = g => D.gc.reduce((a, x) => a + (x.goal === g.id ? x.amt : 0), 0);
function goalInfo(g){
  const saved = goalSaved(g), left = Math.max(0, g.target - saved), pct = g.target ? Math.min(100, saved / g.target * 100) : 0;
  let pace = '';
  if (left > 0 && g.by) { const [y, m] = g.by.split('-').map(Number), [ty, tm] = todayISO().split('-').map(Number), months = (y - ty) * 12 + (m - tm) + 1;
    pace = months > 0 ? `к ${MON_S[m - 1]} ${y} · откладывать ~${fmt(Math.ceil(left / months))} в месяц` : `срок ${MON_S[m - 1]} ${y} прошёл`; }
  return { saved, left, pct, pace };
}
function goalsCard(){
  return `<div class="box"><h2>Цели</h2><div class="blist">${D.goals.map((g, i) => { const x = goalInfo(g);

}

// ===== Year =====
function renderYear(){
  const Y = M.slice(0, 4), ms = Array.from({ length: 12 }, (_, i) => `${Y}-${pad(i + 1)}`), ix = subIndex(), incOn = on('inc');
  const spent = ms.map(m => D.tx.reduce((a, t) => a + (t.date.startsWith(m) && ix[t.sub] ? t.amt : 0), 0));
  const income = ms.map(sumInc), total = spent.reduce((a, b) => a + b, 0), itot = income.reduce((a, b) => a + b, 0);
  const active = spent.filter(v => v > 0).length || 1;
  const k = (l, v, s, cls = '') => `<div class="box kpi ${cls}"><div class="l">${l}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`;
  // chart: spending bars, income as a tick on the same € axis
  const max = Math.max(...spent, ...(incOn ? income : [0]));
  let chart = '<div class="empty">За этот год трат нет</div>';
  if (max) {
    const L = 56, W = 640, H = 190, top = 14, base = 160, step = (W - L) / 12, bw = Math.min(30, step - 10);
    const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / p) * p; })(), yy = v => base - v / nice * (base - top);
    let g = '';
    for (const f of [0, .5, 1]) g += `<line x1="${L}" x2="${W}" y1="${yy(nice * f)}" y2="${yy(nice * f)}" stroke="var(--line)"/><text x="${L - 6}" y="${yy(nice * f) + 3}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(fmt(nice * f))}</text>`;
    ms.forEach((m, i) => { const x = L + i * step + (step - bw) / 2, h = base - yy(spent[i]);
      const tp = `<b>${MONTHS[i]} ${Y}</b><span class=sub>Потрачено ${esc(fmt(spent[i]))}${incOn ? ' · доходы ' + esc(fmt(income[i])) : ''}</span>`;
      g += `<rect class="hit" data-tip="${tp}" x="${L + i * step}" y="${top}" width="${step}" height="${base - top + 22}" fill="transparent"/>`;
      if (h > 0) g += `<path pointer-events="none" fill="${incOn && income[i] && spent[i] > income[i] ? 'var(--red)' : 'var(--s1)'}" d="M${x} ${base} V${base - h + Math.min(4, h)} q0 -4 4 -4 h${bw - 8} q4 0 4 4 V${base} Z"/>`;
      if (incOn && income[i]) g += `<line pointer-events="none" x1="${x - 4}" x2="${x + bw + 4}" y1="${yy(income[i])}" y2="${yy(income[i])}" stroke="var(--ok)" stroke-width="2.5" stroke-linecap="round"/>`;
      g += `<text x="${x + bw / 2}" y="${base + 16}" text-anchor="middle" font-size="11" fill="${m === M ? 'var(--ink)' : 'var(--muted)'}" font-weight="${m === M ? 600 : 400}">${MON_S[i]}</text>`; });
    chart = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Траты по месяцам за ${Y}">${g}</svg>
      <div class="keys"><span><i></i>Потрачено</span>${incOn ? '<span><i class="tick" style="background:var(--ok);opacity:1"></i>Доходы</span><span><i style="background:var(--red)"></i>Трат больше доходов</span>' : ''}</div>`;
  }
  // table: sections × months
  const rows = D.cats.map(c => { const ids = new Set(c.subs.map(s => s.id));
    const v = ms.map(m => D.tx.reduce((a, t) => a + (t.date.startsWith(m) && ids.has(t.sub) ? t.amt : 0), 0)); return { name: c.name, v, sum: v.reduce((a, b) => a + b, 0) }; });
  const cmax = Math.max(1, ...rows.flatMap(r => r.v));
  const cell = v => `<td class="v" style="--a:${v ? Math.round(8 + v / cmax * 42) : 0}%">${v ? fmt(v) : '<span class="muted">—</span>'}</td>`;
  const table = `<div class="tbl"><table class="heat"><thead><tr><th>Раздел</th>${MON_S.map(m => `<th class="r">${m}</th>`).join('')}<th class="r">Итого</th><th class="r">В среднем</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${esc(r.name)}</td>${r.v.map(cell).join('')}<td class="r num" style="font-weight:600">${fmt(r.sum)}</td><td class="r num">${fmt(r.sum / active)}</td></tr>`).join('')}
    <tr class="sum"><td>Всего</td>${spent.map(v => `<td class="r num">${v ? fmt(v) : '—'}</td>`).join('')}<td class="r num">${fmt(total)}</td><td class="r num">${fmt(total / active)}</td></tr>
    ${incOn ? `<tr><td>Доходы</td>${income.map(v => `<td class="r num">${v ? fmt(v) : '—'}</td>`).join('')}<td class="r num" style="font-weight:600">${fmt(itot)}</td><td class="r num">${fmt(itot / active)}</td></tr>` : ''}
    </tbody></table></div>`;
  return `<div class="col">
    <div class="kpis">${k('Потрачено за год', fmt(total), `${active} мес. с тратами`)}${k('В среднем в месяц', fmt(total / active), 'по месяцам с тратами')}
      ${incOn ? k('Доходы за год', fmt(itot), '') + k(itot - total < 0 ? 'Минус за год' : 'Отложено за год', fmt(Math.abs(itot - total)), 'доходы минус траты', itot - total < 0 ? 'over' : itot ? 'good' : '') : ''}</div>
    <div class="box chart"><div class="tools"><h2 style="margin:0;margin-right:auto">По месяцам · ${Y}</h2>${on('xls') ? '<button data-xls>Скачать Excel</button>' : ''}</div>${chart}</div>
    <div class="box"><h2>Разделы по месяцам</h2>${table}</div></div>`;
}
// ===== Excel export (SheetJS, loaded only when asked) =====
let xlsxLib = null;
function loadXlsx(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxLib = xlsxLib || new Promise((ok, no) => { const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => ok(window.XLSX); s.onerror = () => { xlsxLib = null; no(); }; document.head.appendChild(s); });
}
async function exportXlsx(){
  let X; try { X = await loadXlsx(); } catch (_) { toast('Не удалось загрузить Excel-модуль. Проверьте интернет.'); return; }
  const ix = subIndex(), dt = s => { const [y, m, d] = s.split('-').map(Number); return { t: 'n', v: (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5, z: 'dd.mm.yyyy' }; };
  const money = v => ({ t: 'n', v: Math.round(v * 100) / 100, z: '#,##0.00' });
  const sheet = (rows, w) => { const ws = X.utils.aoa_to_sheet(rows); ws['!cols'] = w.map(wch => ({ wch })); return ws; };
  const wb = X.utils.book_new();
  const tx = [...D.tx].filter(t => ix[t.sub]).sort((a, b) => a.date.localeCompare(b.date));
  X.utils.book_append_sheet(wb, sheet([['Дата', 'Раздел', 'Статья', 'Сумма', 'Для кого', 'Чем платили', 'Комментарий', 'Кто внёс'],
    ...tx.map(t => [dt(t.date), ix[t.sub].c.name, ix[t.sub].s.name, money(t.amt), nameOf(D.cfg.tags, t.tag), nameOf(D.cfg.pays, t.pay), t.note || '', t.by || ''])], [11, 14, 24, 11, 14, 14, 28, 12]), 'Траты');
  if (D.inc.length) X.utils.book_append_sheet(wb, sheet([['Дата', 'Источник', 'Сумма', 'Комментарий', 'Кто внёс'],
    ...[...D.inc].sort((a, b) => a.date.localeCompare(b.date)).map(t => [dt(t.date), nameOf(D.cfg.incs, t.src), money(t.amt), t.note || '', t.by || ''])], [11, 16, 11, 28, 12]), 'Доходы');
  const months = [...new Set([...Object.keys(D.plans), ...D.tx.map(t => t.date.slice(0, 7)), ...D.inc.map(t => t.date.slice(0, 7))])].sort();
  const bud = [['Месяц', 'Раздел', 'Статья', 'План', 'Факт', 'Остаток']];
  for (const m of months) { const f = factBySub(m), p = planOf(m);
    for (const c of D.cats) for (const s of c.subs) { const pl = +p[s.id] || 0, fa = f[s.id] || 0; if (pl || fa) bud.push([mLabel(m), c.name, s.name, money(pl), money(fa), money(pl - fa)]); } }
  X.utils.book_append_sheet(wb, sheet(bud, [16, 14, 24, 11, 11, 11]), 'Бюджет');
  X.utils.book_append_sheet(wb, sheet([['Месяц', 'План', 'Потрачено', 'Доходы', 'Доходы − траты'],
    ...months.map(m => { const pl = Object.entries(planOf(m)).reduce((a, [k, v]) => a + (ix[k] ? +v || 0 : 0), 0), sp = Object.values(factBySub(m)).reduce((a, b) => a + b, 0), inc = sumInc(m);
      return [mLabel(m), money(pl), money(sp), money(inc), money(inc - sp)]; })], [16, 12, 12, 12, 16]), 'Итоги по месяцам');
  if (D.goals.length) X.utils.book_append_sheet(wb, sheet([['Цель', 'Нужно', 'Отложено', 'Осталось', 'К месяцу'],
    ...D.goals.map(g => { const x = goalInfo(g); return [g.name, money(g.target), money(x.saved), money(x.left), g.by ? mLabel(g.by) : '']; })], [20, 12, 12, 12, 16]), 'Цели');
  X.writeFile(wb, `budget-${todayISO()}.xlsx`);
}

// ===== Budget =====
function renderBudget(){
  const cats = catTotals(M), p = D.plans[M];
  let prev = null; for (let i = 1; i <= 24; i++) { const m = shiftMonth(M, -i); if (D.plans[m] && Object.keys(D.plans[m]).length) { prev = m; break; } }
  const tp = cats.reduce((a, c) => a + c.plan, 0), tf = cats.reduce((a, c) => a + c.fact, 0);
  const diff = (plan, fact) => plan || fact ? `<span class="num ${plan - fact < 0 ? 'over' : ''}">${fmt(plan - fact)}</span>` : '<span class="muted">—</span>';
  let body = '';
  for (const c of cats) {
    body += `<tr class="cat" style="--c:${color(c.ci)}"><td><div class="row1" style="justify-content:flex-start"><span class="dot"></span>${EDIT
      ? `<input class="name" data-cat="${c.id}" value="${esc(c.name)}"></div></td><td colspan="3" class="r"><button class="icon" data-addsub="${c.id}">+ подраздел</button> <button class="icon danger" data-delcat="${c.id}">Удалить</button></td></tr>`

    </div>
    ${!EDIT ? '<p class="muted" style="margin:-4px 0 12px;font-size:.85rem">Впишите план по каждой статье — сохраняется сразу.</p>' : ''}

// ===== Transactions =====
function renderTx(){
  const ix = subIndex(), incOn = on('inc');
  let list = FILTER === '__inc' ? [] : D.tx.filter(t => t.date.startsWith(M) && ix[t.sub]);
  if (FILTER && FILTER !== '__inc') list = list.filter(t => ix[t.sub].c.id === FILTER);
  if (incOn && (!FILTER || FILTER === '__inc')) list = list.concat(D.inc.filter(t => t.date.startsWith(M)).map(t => ({ ...t, isInc: true })));
  list.sort((a, b) => b.date.localeCompare(a.date));
  const total = list.reduce((a, t) => a + (t.isInc ? 0 : t.amt), 0), itotal = list.reduce((a, t) => a + (t.isInc ? t.amt : 0), 0);
  let html = '', day = '';
  for (const t of list) {
    if (t.date !== day) { day = t.date; const [y, mo, d] = day.split('-').map(Number);
      const sum = list.filter(x => x.date === day && !x.isInc).reduce((a, x) => a + x.amt, 0);
      html += `<div class="day row1"><span>${d} ${MON_S[mo - 1]}</span><span class="num">${fmt(sum)}</span></div>`; }
    const meta = [t.note && esc(t.note), on('pay') && t.pay && nameOf(D.cfg.pays, t.pay) && '💳 ' + esc(nameOf(D.cfg.pays, t.pay)), t.by && '👤 ' + esc(t.by)].filter(Boolean).join(' · ');
    const tag = on('tags') && t.tag && nameOf(D.cfg.tags, t.tag) ? `<span class="badge">${esc(nameOf(D.cfg.tags, t.tag))}</span>` : '';
    if (t.isInc) { html += `<div class="tx"><span class="dot" style="--c:var(--ok)"></span><div class="t"><div>${esc(nameOf(D.cfg.incs, t.src) || 'Доход')} <small>· доход</small></div>${meta ? `<div><small>${meta}</small></div>` : ''}</div>
      <span class="num left">+${fmt(t.amt)}</span><button class="icon danger" data-delinc="${t.id}" aria-label="Удалить">✕</button></div>`; continue; }
    const { s, c, ci } = ix[t.sub];
    html += `<div class="tx"><span class="dot" style="--c:${color(ci)}"></span><div class="t"><div>${esc(s.name)} <small>· ${esc(c.name)}</small>${tag}${t.rec ? '<span class="badge">регулярный</span>' : ''}</div>${meta ? `<div><small>${meta}</small></div>` : ''}</div>
      <span class="num">${fmt(t.amt)}</span><button class="icon danger" data-deltx="${t.id}" aria-label="Удалить">✕</button></div>`;
  }
  return `<div class="box">
    <div class="tools"><h2 style="margin:0;margin-right:auto">Траты · ${mLabel(M).toLowerCase()}</h2>
      <select id="flt"><option value="">Все разделы</option>${D.cats.map(c => `<option value="${c.id}" ${c.id === FILTER ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}${incOn ? `<option value="__inc" ${FILTER === '__inc' ? 'selected' : ''}>Доходы</option>` : ''}</select>
      <span class="num" style="font-weight:600">${FILTER === '__inc' ? '' : fmt(total)}${itotal ? ` <span class="left">+${fmt(itotal)}</span>` : ''}</span></div>
    ${html || '<div class="empty">Трат пока нет — добавьте первую сверху</div>'}</div>`;
}

// ===== Render & events =====
function render(){
  if ({ rec: 1, goals: 1, year: 1 }[TAB] && !on(TAB)) TAB = 'overview';
  renderHead();
  $('view').innerHTML = TAB === 'budget' ? renderBudget() : TAB === 'tx' ? renderTx() : TAB === 'rec' ? renderRec() : TAB === 'goals' ? renderGoals() : TAB === 'year' ? renderYear() : renderOverview();
}

  for (const c of lose.cats || []) for (const sub of c.subs) {

    const id = byPair[norm(c.name) + '|' + norm(sub.name)] || ((byName[norm(sub.name)] || []).length === 1 ? byName[norm(sub.name)][0] : null);
    if (id) { map[sub.id] = id; continue; }

    if (!wc) { wc = { id: winCats.some(x => x.id === c.id) ? uid() : c.id, name: c.name, subs: [] }; winCats.push(wc); }

}

  cfg: Store.load(SKEY), busy: false, again: false, timer: null, st: 'off', at: 0,
  on(){ return !!(this.cfg && this.cfg.repo && this.cfg.token); },
  connect(cfg){ this.cfg = cfg; if (cfg) Store.save(SKEY, cfg); else try { localStorage.removeItem(SKEY); } catch(_) {} this.set(cfg ? 'sync' : 'off'); if (cfg) this.run(); },
  url(){ return `https://api.github.com/repos/${this.cfg.repo}/contents/${encodeURIComponent(this.cfg.path || 'data.json')}`; },
  hdr(){ return { Authorization: 'Bearer ' + this.cfg.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; },
  label(){ return { off: 'Только на этом устройстве', sync: 'Синхронизация…', wait: 'Есть изменения', ok: 'Сохранено в GitHub', net: 'Нет связи — сохранено здесь', auth: 'Ошибка ключа или репозитория', err: 'Ошибка синхронизации' }[this.st]; },
  set(st){ this.st = st; const b = $('sync'); b.hidden = st === 'off'; $('gate').hidden = this.on(); document.querySelector('.wrap').hidden = !this.on();
    b.textContent = { off: '○ не подключено', sync: '↻ синхр.', wait: '● изменения', ok: '✓ GitHub', net: '○ офлайн', auth: '! ключ', err: '! ошибка' }[st] || '';
    b.className = 'icon pill' + (st === 'ok' ? ' ok' : st === 'auth' || st === 'err' || st === 'off' ? ' bad' : '');
    b.title = this.label() + (this.at ? ' · ' + new Date(this.at).toLocaleTimeString('ru-RU') : '') + ' · нажмите, чтобы обновить'; },
  later(){ if (!this.on()) return; this.set('wait'); clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 1200); },
  async run(){
    if (!this.on()) return this.set('off');
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.set('sync'); clearTimeout(this.timer);
    try {
      for (let attempt = 0; ; attempt++) {
        const r = await fetch(this.url() + '?nocache=' + Date.now(), { headers: this.hdr(), cache: 'no-store' });
        if (r.status === 401 || r.status === 403) throw 'auth';
        let raw = null, sha;
        if (r.ok) { const j = await r.json(); sha = j.sha; if (j.encoding !== 'base64') throw 'big'; raw = b64d(j.content); }
        else if (r.status === 404) { /* first save creates the file; a missing repo then fails with 404 again */ }
        else throw 'err';
        const before = canon(D), merged = raw ? merge(D, JSON.parse(raw)) : merge(D, D), text = canon(merged);
        if (text !== raw) {
          const p = await fetch(this.url(), { method: 'PUT', headers: this.hdr(), body: JSON.stringify({ message: 'Бюджет: обновление', content: b64e(text), sha }) });
          if ((p.status === 409 || p.status === 422) && attempt < 3) continue; // someone saved at the same moment: merge again
          if (p.status === 401 || p.status === 403 || p.status === 404) throw 'auth';
          if (!p.ok) throw 'err';
        }
        if (canon(D) !== before) continue; // edited while we were saving: go round once more
        D = merged; Store.save(KEY, D); this.at = Date.now();
        if (text !== before && !document.activeElement.closest('#view input,#view select')) { const y = scrollY; render(); scrollTo(0, y); }
        break;
      }
      this.set('ok');
    } catch (e) {
      this.set(e === 'auth' ? 'auth' : e instanceof TypeError ? 'net' : 'err');
      if (e === 'big') toast('Файл в GitHub стал слишком большим — напишите Claude');
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; this.run(); }
    }
  }
};
$('sync').onclick = () => Sync.st === 'auth' ? $('settings').click() : Sync.run();

// ===== Logins: each user's password unlocks the shared GitHub key (AES-GCM, key from PBKDF2). The list is public, the key inside is not =====
const u8b64 = u => { let r = ''; u.forEach(c => r += String.fromCharCode(c)); return btoa(r); };
const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const Vault = {
  async key(pass, salt, n){ const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); },
  async seal(obj, login, pass){ const n = 310000, salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(login) }, await this.key(pass, salt, n), new TextEncoder().encode(JSON.stringify(obj)));
    return { n, s: u8b64(salt), i: u8b64(iv), c: u8b64(new Uint8Array(c)) }; },
  async open(e, login, pass){ const p = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u8(e.i), additionalData: new TextEncoder().encode(login) }, await this.key(pass, b64u8(e.s), e.n), b64u8(e.c));
    return JSON.parse(new TextDecoder().decode(p)); }
};
const Users = {
  repo: 'StepaShpitz/timer', path: 'bmsctoug1t0q/users.json',
  norm: s => String(s).trim().toLowerCase(),
  url(){ return `https://api.github.com/repos/${this.repo}/contents/${this.path}`; },
  hdr(t){ const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; if (t) h.Authorization = 'Bearer ' + t; return h; },
  async load(token){
    try {
      const r = await fetch(this.url() + '?nocache=' + Date.now(), { headers: this.hdr(token), cache: 'no-store' });
      if (r.status === 404) return { users: {}, sha: undefined };
      if (r.ok) { const j = await r.json(); return { users: JSON.parse(b64d(j.content)).users || {}, sha: j.sha }; }
    } catch (e) { if (!token) throw e; }
    // the API allows a few anonymous calls per hour; the published copy of the file is the fallback
    const r = await fetch('users.json?' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) return { users: {}, sha: undefined };
    if (!r.ok) throw 'net';
    return { users: (await r.json()).users || {}, sha: undefined };
  },
  async save(users, sha, token, message){
    const body = { message, content: b64e(JSON.stringify({ users }, null, 1) + '\n') }; if (sha) body.sha = sha;
    const r = await fetch(this.url(), { method: 'PUT', headers: this.hdr(token), body: JSON.stringify(body) });
    if (r.status === 401 || r.status === 403 || r.status === 404) throw 'scope';
        if (!r.ok) throw 'net';
    return { users, sha: (await r.json()).content.sha };
  }
};
$('loginf').addEventListener('submit', async e => {
  e.preventDefault();
  const n = Users.norm($('l-user').value), pw = $('l-pass').value, err = $('l-err'), btn = $('l-btn');
  err.hidden = true; btn.disabled = true; btn.textContent = 'Вход…';
  try {
    const { users } = await Users.load();
    if (!users[n]) throw 'bad';
    let c; try { c = await Vault.open(users[n], n, pw); } catch (_) { throw 'bad'; }
    $('l-pass').value = '';
    Sync.connect({ repo: c.r, token: c.t, path: c.p || 'data.json', user: n }); render();
  } catch (x) {
    err.textContent = x === 'bad' ? 'Неверный логин или пароль' : 'Нет связи. Проверьте интернет и попробуйте ещё раз.'; err.hidden = false;
  } finally { btn.disabled = false; btn.textContent = 'Войти'; }
});
$('k-btn').onclick = () => {
  const repo = $('k-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''), token = $('k-token').value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) { toast('Укажите репозиторий и ключ'); return; }
  Sync.connect({ repo, token, path: 'data.json' }); render();
};
// a phone link like …/#sync=… connects this device and removes the key from the address bar
if (location.hash.startsWith('#sync=')) {
  try { const c = JSON.parse(atob(decodeURIComponent(location.hash.slice(6)))); Sync.cfg = { repo: c.r, token: c.t, path: c.p || 'data.json' }; Store.save(SKEY, Sync.cfg); setTimeout(() => toast('Синхронизация подключена'), 300); } catch(_) { toast('Ссылка повреждена'); }
  history.replaceState(null, '', location.pathname);
}
addEventListener('online', () => Sync.run());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Sync.run(); });
setInterval(() => { if (document.visibilityState === 'visible' && Sync.st !== 'auth') Sync.run(); }, 60000);

Sync.set(Sync.on() ? 'sync' : 'off');
render();
Sync.run();
</script>
