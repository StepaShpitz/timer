<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Задачи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --border: #e5e7eb;
  --text: #111827;
  --text2: #6b7280;
  --blue: #3b82f6;
  --blue-bg: #eff6ff;
  --green: #22c55e;
  --green-bg: #f0fdf4;
  --yellow: #f59e0b;
  --yellow-bg: #fffbeb;
  --red: #ef4444;
  --red-bg: #fef2f2;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,0.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827; --surface: #1f2937; --border: #374151;
    --text: #f9fafb; --text2: #9ca3af;
    --blue-bg: #1e3a5f; --green-bg: #14532d; --yellow-bg: #451a03; --red-bg: #450a0a;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}

/* ── Header ── */
header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 20px;position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.header-left{display:flex;align-items:center;gap:10px}
header h1{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:8px}
.h-icon{display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:8px;background:var(--blue-bg);color:var(--blue)}
.h-icon svg{width:17px;height:17px}

/* Tags bar */
.tags-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag-filter{
  padding:3px 10px;border-radius:999px;border:1px solid var(--border);
  background:none;color:var(--text2);font:500 0.75rem Inter,sans-serif;cursor:pointer;
  transition:all .15s;
}
.tag-filter.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ── Layout ── */
.page{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:16px;padding:16px;max-width:1200px;margin:0 auto;align-items:start;
}
@media(max-width:900px){.page{grid-template-columns:1fr}}

/* ── Section ── */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.section-head{
  padding:12px 14px 10px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.section-title{font-size:0.9rem;font-weight:700;display:flex;align-items:center;gap:7px}
.sec-icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:7px;
  background:var(--bg);border:1px solid var(--border);flex-shrink:0;
}
.sec-icon svg{width:14px;height:14px}
.section-badge{
  font-size:0.7rem;color:var(--text2);
  background:var(--bg);border:1px solid var(--border);
  border-radius:999px;padding:1px 7px;font-weight:500;
}
.section-actions{display:flex;gap:5px;align-items:center}
.section-body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:5px;min-height:40px}

/* ── Buttons ── */
.btn-add{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;background:var(--blue);
  border:none;border-radius:7px;cursor:pointer;flex-shrink:0;
  box-shadow:0 1px 3px rgba(59,130,246,.35);transition:opacity .15s;
}
.btn-add:hover{opacity:.85}
.btn-add svg{width:15px;height:15px;stroke:#fff}
.btn-sm{
  background:none;border:1px solid var(--border);color:var(--text2);
  font:500 0.73rem Inter,sans-serif;padding:3px 9px;border-radius:7px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.btn-sm:hover{background:var(--border);color:var(--text)}
.btn-icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:6px;
  background:var(--bg);border:1px solid var(--border);
  color:var(--text2);cursor:pointer;transition:all .15s;flex-shrink:0;
}
.btn-icon:hover{background:var(--border);color:var(--text)}
.btn-icon svg{width:12px;height:12px;stroke:currentColor}

/* ── Task card ── */
.task-card{
  border:1px solid var(--border);border-radius:9px;padding:9px 10px;
  display:flex;align-items:flex-start;gap:8px;
  background:var(--bg);transition:box-shadow .15s, opacity .15s;
  cursor:grab;position:relative;
}
.task-card:active{cursor:grabbing}
.task-card:hover{box-shadow:var(--shadow)}
.task-card.done{opacity:.4}
.task-card.dragging{opacity:.4;border-style:dashed}
.task-card.drag-over{box-shadow:0 0 0 2px var(--blue)}

/* Checkbox */
.task-check{
  width:17px;height:17px;border:2px solid var(--border);border-radius:4px;
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  margin-top:2px;transition:all .15s;
}
.task-check.checked{background:var(--green);border-color:var(--green)}
.task-check.checked::after{content:'✓';color:#fff;font-size:9px;font-weight:800}

/* Status dot */
.status-dot{
  width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;cursor:pointer;
  transition:transform .1s;
}
.status-dot:hover{transform:scale(1.3)}
.status-dot.todo  {background:var(--border);border:2px solid var(--text2)}
.status-dot.inprog{background:var(--yellow)}
.status-dot.done-st{background:var(--green)}

/* Priority stripe */
.priority-stripe{
  position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:2px;
}
.priority-stripe.high  {background:var(--red)}
.priority-stripe.medium{background:var(--yellow)}
.priority-stripe.low   {background:var(--green)}
.task-card.has-priority{padding-left:14px}

.task-body{flex:1;min-width:0}
.task-name{font-size:0.84rem;font-weight:500;word-break:break-word;line-height:1.4}
.task-name.strikethrough{text-decoration:line-through}
.task-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:3px}
.task-note{font-size:0.74rem;color:var(--text2)}
.task-due{
  font-size:0.7rem;padding:1px 6px;border-radius:999px;
  background:var(--yellow-bg);color:var(--yellow);font-weight:500;
  display:inline-flex;align-items:center;gap:3px;
}
.task-due.overdue{background:var(--red-bg);color:var(--red)}
.task-due.ok     {background:var(--green-bg);color:var(--green)}
.task-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.task-tag{
  font-size:0.68rem;padding:1px 7px;border-radius:999px;
  background:var(--border);color:var(--text2);font-weight:500;
}
.task-actions{display:flex;gap:3px;flex-shrink:0}

/* Steps */
.steps-list{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.step-item{display:flex;align-items:center;gap:5px}
.step-check{
  width:12px;height:12px;border:2px solid var(--border);border-radius:3px;
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .1s;
}
.step-check.checked{background:var(--blue);border-color:var(--blue)}
.step-check.checked::after{content:'✓';color:#fff;font-size:7px;font-weight:800}
.step-name{font-size:0.74rem;color:var(--text2)}
.step-name.done{text-decoration:line-through}
.progress-wrap{margin-top:4px}
.progress-bar{height:3px;border-radius:2px;background:var(--border);overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.progress-label{font-size:0.68rem;color:var(--text2);margin-top:2px}

/* Recurring badge */
.recur-badge{
  font-size:0.68rem;padding:1px 6px;border-radius:999px;
  background:var(--blue-bg);color:var(--blue);font-weight:500;
  display:inline-flex;align-items:center;gap:3px;
}

/* Group label */
.group-label{
  font-size:0.68rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text2);padding:4px 2px 2px;
}

/* Archive toggle */
.archive-toggle{
  font-size:0.73rem;color:var(--text2);cursor:pointer;
  padding:4px 2px;display:flex;align-items:center;gap:4px;
  user-select:none;
}
.archive-toggle:hover{color:var(--text)}

/* Empty */
.empty{text-align:center;padding:22px 10px;color:var(--text2);font-size:0.8rem}
.empty svg{width:28px;height:28px;stroke:var(--border);margin-bottom:6px;display:block;margin-left:auto;margin-right:auto}

/* ── Modal ── */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:16px;
}
.modal-backdrop.hidden{display:none}
.modal{
  background:var(--surface);border-radius:var(--radius);
  padding:18px;width:100%;max-width:430px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  max-height:90dvh;overflow-y:auto;
}
.modal h2{font-size:0.93rem;font-weight:700;margin-bottom:14px}
.field{margin-bottom:10px}
.field label{display:block;font-size:0.76rem;font-weight:500;color:var(--text2);margin-bottom:3px}
.field input,.field textarea,.field select{
  width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font:0.84rem Inter,sans-serif;outline:none;
  transition:border-color .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}
.field textarea{resize:vertical;min-height:52px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn-cancel{
  padding:6px 14px;border:1px solid var(--border);border-radius:8px;
  background:none;color:var(--text);font:500 0.84rem Inter,sans-serif;cursor:pointer;
}
.btn-save{
  padding:6px 14px;background:var(--blue);color:#fff;
  border:none;border-radius:8px;font:500 0.84rem Inter,sans-serif;cursor:pointer;
}
.btn-save:hover{opacity:.87}

/* Status row */
.status-row{display:flex;gap:5px}
.status-btn{
  flex:1;padding:5px 4px;border-radius:7px;border:1px solid var(--border);
  background:none;color:var(--text2);font:500 0.73rem Inter,sans-serif;cursor:pointer;
  transition:all .15s;
}
.status-btn.active-todo  {background:var(--border);color:var(--text);border-color:transparent}
.status-btn.active-inprog{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow)}
.status-btn.active-done  {background:var(--green-bg);color:var(--green);border-color:var(--green)}

/* Priority row */
.priority-row{display:flex;gap:5px}
.prio-btn{
  flex:1;padding:5px 4px;border-radius:7px;border:1px solid var(--border);
  background:none;color:var(--text2);font:500 0.73rem Inter,sans-serif;cursor:pointer;
  transition:all .15s;
}
.prio-btn.active-high  {background:var(--red-bg);color:var(--red);border-color:var(--red)}
.prio-btn.active-medium{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow)}
.prio-btn.active-low   {background:var(--green-bg);color:var(--green);border-color:var(--green)}
.prio-btn.active-none  {background:var(--border);color:var(--text);border-color:transparent}

/* Tags editor */
.tags-editor{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag-pill{
  padding:3px 9px;border-radius:999px;background:var(--border);
  color:var(--text2);font:500 0.73rem Inter,sans-serif;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;gap:4px;
}
.tag-pill.selected{background:var(--blue);color:#fff}
.tag-pill .rm{font-size:0.8rem;opacity:.6;cursor:pointer}
.tag-new-wrap{display:flex;gap:5px;margin-top:5px}
.tag-new-wrap input{flex:1;min-width:0}
.btn-tag-add{
  padding:4px 10px;border-radius:7px;background:none;border:1px solid var(--border);
  color:var(--text2);font:500 0.73rem Inter,sans-serif;cursor:pointer;white-space:nowrap;
}
.btn-tag-add:hover{background:var(--border)}

/* Steps editor */
.steps-editor{display:flex;flex-direction:column;gap:5px}
.step-editor-row{display:flex;gap:5px;align-items:center}
.step-editor-row input{flex:1}
.btn-step-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:.9rem;padding:2px 4px}
.btn-add-step{
  background:none;border:1px dashed var(--border);border-radius:7px;
  color:var(--text2);font:500 0.76rem Inter,sans-serif;
  padding:5px;cursor:pointer;width:100%;margin-top:3px;transition:border-color .15s;
}
.btn-add-step:hover{border-color:var(--blue);color:var(--blue)}

/* Recur toggle */
.recur-wrap{display:flex;align-items:center;gap:8px}
.toggle{
  position:relative;width:34px;height:18px;
  background:var(--border);border-radius:9px;cursor:pointer;
  transition:background .2s;flex-shrink:0;
}
.toggle.on{background:var(--blue)}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:14px;height:14px;border-radius:50%;background:#fff;
  transition:left .2s;
}
.toggle.on::after{left:18px}
.toggle-label{font-size:0.8rem;color:var(--text2)}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>
      <span class="h-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12l2 2 4-4"/></svg>
      </span>
      Задачи
    </h1>
    <span id="syncStatus" style="font-size:0.72rem;font-weight:500;color:var(--text2);margin-left:4px">загрузка…</span>
  </div>
  <div class="tags-bar" id="tagsBar"></div>
</header>

<div class="page" id="app"></div>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">Задача</h2>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">Отмена</button>
      <button class="btn-save" id="modalSave">Сохранить</button>
    </div>
  </div>
</div>

<script>
// ─── Icons ────────────────────────────────────────────────────────────────
const ic = {
  sun:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>`,
  timer:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M12 14l-2-2"/><circle cx="12" cy="14" r="8"/><path d="M4.93 5 4 4"/></svg>`,
  target:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  pencil:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`,
  trash:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  cal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  repeat:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,
  inbox:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
  chevron:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
};

// ─── Config ───────────────────────────────────────────────────────────────
const GH_TOKEN = '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';
const GH_REPO  = 'StepaShpitz/timer';
const GH_FILE  = 'tasks-data/tasks.json';
const GH_API   = `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`;
const LS_KEY   = 'tasks.v2'; // local cache

// ─── Storage ──────────────────────────────────────────────────────────────
function init(){return{daily:[],mid:[],long:[],dailyDate:'',tags:[],filterTag:null,showArchive:{daily:false,mid:false,long:false}}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function migrate(d){
  if(!d.tags) d.tags=[];
  if(d.filterTag===undefined) d.filterTag=null;
  if(!d.showArchive) d.showArchive={daily:false,mid:false,long:false};
  ['daily','mid','long'].forEach(s=>{
    (d[s]||[]).forEach(t=>{
      if(!t.priority) t.priority='none';
      if(!t.tags) t.tags=[];
      if(!t.note) t.note='';
      if(s==='daily'&&t.recurring===undefined) t.recurring=false;
    });
  });
  return d;
}

function loadLocal(){
  try{return migrate(JSON.parse(localStorage.getItem(LS_KEY))||init())}catch{return init()}
}
function saveLocal(d){
  localStorage.setItem(LS_KEY,JSON.stringify(d));
}

// Status indicator in header
function setSyncStatus(state){ // 'ok'|'saving'|'error'|'loading'
  const el=document.getElementById('syncStatus');
  if(!el)return;
  const map={
    loading:{txt:'загрузка…',  color:'var(--text2)'},
    saving: {txt:'сохранение…',color:'var(--yellow)'},
    ok:     {txt:'✓ сохранено', color:'var(--green)'},
    error:  {txt:'⚠ ошибка',   color:'var(--red)'},
  };
  const s=map[state]||map.ok;
  el.textContent=s.txt; el.style.color=s.color;
}

let ghSha=null; // current file SHA, needed for updates

async function loadRemote(){
  setSyncStatus('loading');
  try{
    const r=await fetch(GH_API+'?t='+Date.now(),{
      headers:{Authorization:`token ${GH_TOKEN}`,Accept:'application/vnd.github.v3+json'}
    });
    if(r.status===404){ghSha=null;return init()} // file doesn't exist yet
    if(!r.ok) throw new Error(r.status);
    const f=await r.json();
    ghSha=f.sha;
    const d=migrate(JSON.parse(atob(f.content.replace(/\n/g,''))));
    saveLocal(d);
    setSyncStatus('ok');
    return d;
  }catch(e){
    console.warn('GH load failed, using local cache',e);
    setSyncStatus('error');
    return loadLocal();
  }
}

let saveTimer=null;
async function save(d){
  saveLocal(d);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    setSyncStatus('saving');
    try{
      const body={
        message:'tasks update',
        content:btoa(unescape(encodeURIComponent(JSON.stringify(d,null,2)))),
        branch:'main'
      };
      if(ghSha) body.sha=ghSha;
      const r=await fetch(GH_API,{
        method:'PUT',
        headers:{
          Authorization:`token ${GH_TOKEN}`,
          Accept:'application/vnd.github.v3+json',
          'Content-Type':'application/json'
        },
        body:JSON.stringify(body)
      });
      if(!r.ok){const e=await r.json();throw new Error(e.message)}
      const f=await r.json();
      ghSha=f.content?.sha||ghSha;
      setSyncStatus('ok');
    }catch(e){
      console.warn('GH save failed',e);
      setSyncStatus('error');
    }
  },800);
}

let data=loadLocal(); // show cached immediately, then refresh from Gist

let editId=null, editSection=null;
let tempSteps=[], tempStatus='todo', tempPriority='none', tempTags=[], tempNewTag='';

// Auto-reset daily
function checkReset(){
  const today=new Date().toISOString().slice(0,10);
  if(data.dailyDate!==today){
    data.daily.forEach(t=>{t.done=false});
    data.dailyDate=today;
    save(data);
  }
}

// Boot: show local cache instantly, then load from GitHub
(async()=>{
  checkReset();
  render();
  const fresh=await loadRemote();
  // Check reset again on fresh data (different device, different day)
  const today=new Date().toISOString().slice(0,10);
  if(fresh.dailyDate!==today){
    fresh.daily.forEach(t=>{t.done=false});
    fresh.dailyDate=today;
    await save(fresh);
  }
  data=fresh;
  render();
})();

// ─── Tags bar ─────────────────────────────────────────────────────────────
function renderTagsBar(){
  const all=data.tags;
  if(!all.length){document.getElementById('tagsBar').innerHTML='';return}
  document.getElementById('tagsBar').innerHTML=
    `<button class="tag-filter ${!data.filterTag?'active':''}" data-tag="">Все</button>`+
    all.map(t=>`<button class="tag-filter ${data.filterTag===t?'active':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('');
  document.querySelectorAll('.tag-filter').forEach(b=>{
    b.addEventListener('click',()=>{data.filterTag=b.dataset.tag||null;save(data);render()});
  });
}

// ─── Render ───────────────────────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML=
    renderDaily()+renderSection('mid','Средние',ic.timer)+renderSection('long','Долгие',ic.target);
  renderTagsBar();
  bindEvents();
  initDrag();
}

function filterTasks(list){
  if(!data.filterTag) return list;
  return list.filter(t=>(t.tags||[]).includes(data.filterTag));
}

// ── Daily ──
function renderDaily(){
  const tasks=filterTasks(data.daily);
  const done=tasks.filter(t=>t.done).length;
  const todo=tasks.filter(t=>!t.done);
  const doneList=tasks.filter(t=>t.done);
  const showArch=data.showArchive.daily;
  return `
  <div class="section">
    <div class="section-head">
      <div class="section-title">
        <span class="sec-icon">${ic.sun}</span>
        Дейли
        <span class="section-badge">${done}/${tasks.length}</span>
      </div>
      <div class="section-actions">
        ${tasks.length?`<button class="btn-sm" data-action="resetDaily">Сбросить</button>`:''}
        <button class="btn-add" data-action="addTask" data-sec="daily" title="Добавить">${ic.plus}</button>
      </div>
    </div>
    <div class="section-body" data-sec="daily" id="list-daily">
      ${todo.map(t=>dailyCard(t)).join('')}
      ${doneList.length?`
        <div class="archive-toggle" data-action="toggleArchive" data-sec="daily">
          <span style="transform:rotate(${showArch?'180':'0'}deg);display:inline-block;transition:transform .2s">${ic.chevron}</span>
          Выполнено (${doneList.length})
        </div>
        ${showArch?doneList.map(t=>dailyCard(t)).join(''):''}
      `:''}
      ${!tasks.length?`<div class="empty">${ic.inbox}<span>Задачи на день</span></div>`:''}
    </div>
  </div>`;
}

function dailyCard(t){
  const hasPrio=t.priority&&t.priority!=='none';
  return `
  <div class="task-card ${t.done?'done':''} ${hasPrio?'has-priority':''}" data-id="${t.id}" data-sec="daily" draggable="true">
    ${hasPrio?`<div class="priority-stripe ${t.priority}"></div>`:''}
    <div class="task-check ${t.done?'checked':''}" data-action="toggleDone" data-id="${t.id}"></div>
    <div class="task-body">
      <div class="task-name ${t.done?'strikethrough':''}">${esc(t.name)}</div>
      ${t.note?`<div class="task-note">${esc(t.note)}</div>`:''}
      <div class="task-meta">
        ${t.recurring?`<span class="recur-badge">${ic.repeat} повтор</span>`:''}
        ${(t.tags||[]).map(g=>`<span class="task-tag">${esc(g)}</span>`).join('')}
      </div>
    </div>
    <div class="task-actions">
      <button class="btn-icon" data-action="editTask" data-sec="daily" data-id="${t.id}" title="Изменить">${ic.pencil}</button>
      <button class="btn-icon" data-action="deleteTask" data-sec="daily" data-id="${t.id}" title="Удалить">${ic.trash}</button>
    </div>
  </div>`;
}

// ── Mid / Long ──
function renderSection(type,title,icon){
  const tasks=filterTasks(data[type]);
  const showArch=data.showArchive[type];
  const groups=[
    {key:'inprog',label:'В процессе'},
    {key:'todo',  label:'Не начато'},
  ];
  const doneList=tasks.filter(t=>(t.status||'todo')==='done');
  let body='';
  let hasActive=false;
  groups.forEach(g=>{
    const list=tasks.filter(t=>(t.status||'todo')===g.key);
    if(!list.length)return;
    hasActive=true;
    body+=`<div class="group-label">${g.label}</div>`;
    list.forEach(t=>{body+=midCard(t,type)});
  });
  if(doneList.length){
    body+=`
    <div class="archive-toggle" data-action="toggleArchive" data-sec="${type}">
      <span style="transform:rotate(${showArch?'180':'0'}deg);display:inline-block;transition:transform .2s">${ic.chevron}</span>
      Выполнено (${doneList.length})
    </div>
    ${showArch?doneList.map(t=>midCard(t,type)).join(''):''}`;
    hasActive=true;
  }
  if(!hasActive) body=`<div class="empty">${ic.inbox}<span>Нет задач</span></div>`;
  return `
  <div class="section">
    <div class="section-head">
      <div class="section-title"><span class="sec-icon">${icon}</span>${title}</div>
      <button class="btn-add" data-action="addTask" data-sec="${type}" title="Добавить">${ic.plus}</button>
    </div>
    <div class="section-body" data-sec="${type}" id="list-${type}">${body}</div>
  </div>`;
}

function midCard(t,type){
  const steps=t.steps||[];
  const doneSteps=steps.filter(s=>s.done).length;
  const pct=steps.length?Math.round(doneSteps/steps.length*100):0;
  const st=t.status||'todo';
  const dotCls=st==='done'?'done-st':st==='inprog'?'inprog':'todo';
  const hasPrio=t.priority&&t.priority!=='none';
  let dueHtml='';
  if(t.due){
    const diff=Math.round((new Date(t.due)-new Date())/86400000);
    const cls=diff<0?'overdue':diff<=3?'':'ok';
    const label=diff<0?`просрочено ${-diff}д`:diff===0?'сегодня':`через ${diff}д`;
    dueHtml=`<span class="task-due ${cls}">${ic.cal}${label}</span>`;
  }
  return `
  <div class="task-card ${hasPrio?'has-priority':''}" data-id="${t.id}" data-sec="${type}" draggable="true">
    ${hasPrio?`<div class="priority-stripe ${t.priority}"></div>`:''}
    <div class="status-dot ${dotCls}" data-action="cycleStatus" data-sec="${type}" data-id="${t.id}" title="Изменить статус"></div>
    <div class="task-body">
      <div class="task-name ${st==='done'?'strikethrough':''}">${esc(t.name)}</div>
      ${t.note?`<div class="task-note">${esc(t.note)}</div>`:''}
      <div class="task-meta">
        ${dueHtml}
        ${(t.tags||[]).map(g=>`<span class="task-tag">${esc(g)}</span>`).join('')}
      </div>
      ${steps.length?`
        <div class="steps-list">
          ${steps.map(s=>`
            <div class="step-item">
              <div class="step-check ${s.done?'checked':''}" data-action="toggleStep" data-sec="${type}" data-tid="${t.id}" data-sid="${s.id}"></div>
              <span class="step-name ${s.done?'done':''}">${esc(s.name)}</span>
            </div>`).join('')}
        </div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">${doneSteps} из ${steps.length}</div>
        </div>`:''}
    </div>
    <div class="task-actions">
      <button class="btn-icon" data-action="editTask" data-sec="${type}" data-id="${t.id}" title="Изменить">${ic.pencil}</button>
      <button class="btn-icon" data-action="deleteTask" data-sec="${type}" data-id="${t.id}" title="Удалить">${ic.trash}</button>
    </div>
  </div>`;
}

// ─── Modal ────────────────────────────────────────────────────────────────
function openModal(sec,id){
  editSection=sec; editId=id||null;
  const list=data[sec];
  const task=id?list.find(t=>t.id===id):null;
  tempSteps=task?JSON.parse(JSON.stringify(task.steps||[])):[];
  tempStatus=task?(task.status||'todo'):'todo';
  tempPriority=task?(task.priority||'none'):'none';
  tempTags=task?[...(task.tags||[])]:[];
  document.getElementById('modalTitle').textContent=id?'Изменить задачу':'Новая задача';

  const allTags=data.tags;

  if(sec==='daily'){
    document.getElementById('modalBody').innerHTML=`
      <div class="field"><label>Название</label><input id="fName" placeholder="Что нужно сделать?" value="${esc(task?.name||'')}"></div>
      <div class="field"><label>Заметка</label><textarea id="fNote">${esc(task?.note||'')}</textarea></div>
      <div class="field"><label>Приоритет</label>
        <div class="priority-row">
          <button class="prio-btn ${tempPriority==='high'?'active-high':''}" data-prio="high">🔴 Высокий</button>
          <button class="prio-btn ${tempPriority==='medium'?'active-medium':''}" data-prio="medium">🟡 Средний</button>
          <button class="prio-btn ${tempPriority==='low'?'active-low':''}" data-prio="low">🟢 Низкий</button>
          <button class="prio-btn ${tempPriority==='none'?'active-none':''}" data-prio="none">—</button>
        </div>
      </div>
      <div class="field"><label>Повторяющаяся задача</label>
        <div class="recur-wrap">
          <div class="toggle ${task?.recurring?'on':''}" id="recurToggle"></div>
          <span class="toggle-label">Автоматически сбрасывать каждый день</span>
        </div>
      </div>
      <div class="field"><label>Теги</label>${renderTagsEditor(allTags)}</div>`;
  } else {
    document.getElementById('modalBody').innerHTML=`
      <div class="field"><label>Название</label><input id="fName" placeholder="Задача" value="${esc(task?.name||'')}"></div>
      <div class="field"><label>Статус</label>
        <div class="status-row">
          <button class="status-btn ${tempStatus==='todo'?'active-todo':''}" data-st="todo">Не начато</button>
          <button class="status-btn ${tempStatus==='inprog'?'active-inprog':''}" data-st="inprog">В процессе</button>
          <button class="status-btn ${tempStatus==='done'?'active-done':''}" data-st="done">Готово</button>
        </div>
      </div>
      <div class="field"><label>Приоритет</label>
        <div class="priority-row">
          <button class="prio-btn ${tempPriority==='high'?'active-high':''}" data-prio="high">🔴 Высокий</button>
          <button class="prio-btn ${tempPriority==='medium'?'active-medium':''}" data-prio="medium">🟡 Средний</button>
          <button class="prio-btn ${tempPriority==='low'?'active-low':''}" data-prio="low">🟢 Низкий</button>
          <button class="prio-btn ${tempPriority==='none'?'active-none':''}" data-prio="none">—</button>
        </div>
      </div>
      <div class="field"><label>Срок</label><input id="fDue" type="date" value="${task?.due||''}"></div>
      <div class="field"><label>Заметка</label><textarea id="fNote">${esc(task?.note||'')}</textarea></div>
      <div class="field"><label>Теги</label>${renderTagsEditor(allTags)}</div>
      <div class="field"><label>Шаги</label>
        <div class="steps-editor" id="stepsEditor">${renderStepsEditor()}</div>
        <button class="btn-add-step" id="btnAddStep">＋ Добавить шаг</button>
      </div>`;
  }

  document.getElementById('modalBackdrop').classList.remove('hidden');

  // Bind
  setTimeout(()=>{
    document.getElementById('fName')?.focus();
    // Priority
    document.querySelectorAll('[data-prio]').forEach(b=>b.addEventListener('click',()=>{
      tempPriority=b.dataset.prio;
      document.querySelectorAll('[data-prio]').forEach(x=>x.className='prio-btn');
      b.classList.add('active-'+tempPriority);
    }));
    // Status
    document.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>{
      tempStatus=b.dataset.st;
      document.querySelectorAll('[data-st]').forEach(x=>x.className='status-btn');
      b.classList.add('active-'+tempStatus);
    }));
    // Recurring toggle
    document.getElementById('recurToggle')?.addEventListener('click',function(){
      this.classList.toggle('on');
    });
    // Tags
    bindTagsEditor();
    // Steps
    document.getElementById('btnAddStep')?.addEventListener('click',()=>{
      tempSteps.push({id:uid(),name:'',done:false});
      document.getElementById('stepsEditor').innerHTML=renderStepsEditor();
      bindStepEditorEvents();
    });
    bindStepEditorEvents();
  },0);
}

function renderTagsEditor(allTags){
  const knownTags=allTags.map(t=>`
    <span class="tag-pill ${tempTags.includes(t)?'selected':''}" data-tpill="${esc(t)}">
      ${esc(t)}
    </span>`).join('');
  return `
    <div class="tags-editor" id="tagsEditor">${knownTags}</div>
    <div class="tag-new-wrap">
      <input id="tagNewInput" placeholder="Новый тег..." value="">
      <button class="btn-tag-add" id="btnTagAdd">＋ Добавить</button>
    </div>`;
}

function bindTagsEditor(){
  document.querySelectorAll('[data-tpill]').forEach(el=>{
    el.addEventListener('click',()=>{
      const t=el.dataset.tpill;
      if(tempTags.includes(t)) tempTags=tempTags.filter(x=>x!==t);
      else tempTags.push(t);
      el.classList.toggle('selected',tempTags.includes(t));
    });
  });
  document.getElementById('btnTagAdd')?.addEventListener('click',()=>{
    const val=document.getElementById('tagNewInput')?.value.trim();
    if(!val)return;
    if(!data.tags.includes(val)){data.tags.push(val);save(data)}
    if(!tempTags.includes(val)) tempTags.push(val);
    // re-render tags editor
    document.getElementById('tagsEditor').innerHTML=
      data.tags.map(t=>`<span class="tag-pill ${tempTags.includes(t)?'selected':''}" data-tpill="${esc(t)}">${esc(t)}</span>`).join('');
    document.getElementById('tagNewInput').value='';
    bindTagsEditor();
  });
  document.getElementById('tagNewInput')?.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();document.getElementById('btnTagAdd')?.click()}
  });
}

function renderStepsEditor(){
  return tempSteps.map((s,i)=>`
    <div class="step-editor-row" data-si="${i}">
      <input class="step-input" data-si="${i}" value="${esc(s.name)}" placeholder="Шаг ${i+1}">
      <button class="btn-step-del" data-action="delStep" data-si="${i}">✕</button>
    </div>`).join('');
}
function bindStepEditorEvents(){
  document.querySelectorAll('.step-input').forEach(inp=>{
    inp.addEventListener('input',e=>{tempSteps[+e.target.dataset.si].name=e.target.value});
  });
  document.querySelectorAll('[data-action="delStep"]').forEach(b=>{
    b.addEventListener('click',e=>{
      tempSteps.splice(+e.target.dataset.si,1);
      document.getElementById('stepsEditor').innerHTML=renderStepsEditor();
      bindStepEditorEvents();
    });
  });
}

function closeModal(){document.getElementById('modalBackdrop').classList.add('hidden');editId=null}

function saveModal(){
  const name=document.getElementById('fName')?.value.trim();
  if(!name){document.getElementById('fName')?.focus();return}
  const note=document.getElementById('fNote')?.value.trim()||'';
  const due =document.getElementById('fDue')?.value||'';
  const recurring=document.getElementById('recurToggle')?.classList.contains('on')||false;
  const list=data[editSection];
  if(editId){
    const t=list.find(x=>x.id===editId);
    if(!t)return;
    t.name=name; t.note=note; t.priority=tempPriority; t.tags=tempTags;
    if(editSection==='daily') t.recurring=recurring;
    else{t.status=tempStatus;t.due=due;t.steps=tempSteps.filter(s=>s.name.trim())}
  } else {
    const task={id:uid(),name,note,priority:tempPriority,tags:tempTags};
    if(editSection==='daily'){task.done=false;task.recurring=recurring}
    else{task.status=tempStatus;task.due=due;task.steps=tempSteps.filter(s=>s.name.trim())}
    list.push(task);
  }
  save(data);closeModal();render();
}

// ─── Drag & Drop ──────────────────────────────────────────────────────────
let dragId=null, dragSec=null;
function initDrag(){
  document.querySelectorAll('.task-card[draggable]').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragId=card.dataset.id; dragSec=card.dataset.sec;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    card.addEventListener('dragover',e=>{e.preventDefault();card.classList.add('drag-over')});
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{
      e.preventDefault(); card.classList.remove('drag-over');
      const overId=card.dataset.id;
      if(dragId===overId||dragSec!==card.dataset.sec)return;
      const list=data[dragSec];
      const fromIdx=list.findIndex(t=>t.id===dragId);
      const toIdx  =list.findIndex(t=>t.id===overId);
      if(fromIdx<0||toIdx<0)return;
      const [item]=list.splice(fromIdx,1);
      list.splice(toIdx,0,item);
      save(data); render();
    });
  });
}

// ─── Events ───────────────────────────────────────────────────────────────
function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',handleAction));
}
function handleAction(e){
  const a=e.currentTarget.dataset.action;
  const id=e.currentTarget.dataset.id;
  const sec=e.currentTarget.dataset.sec;
  if(a==='addTask'){openModal(sec,null);return}
  if(a==='editTask'){openModal(sec,id);return}
  if(a==='deleteTask'){
    if(!confirm('Удалить задачу?'))return;
    data[sec]=data[sec].filter(t=>t.id!==id);
    save(data);render();return;
  }
  if(a==='toggleDone'){
    const t=data.daily.find(x=>x.id===id);
    if(t){t.done=!t.done;save(data);render()}return;
  }
  if(a==='cycleStatus'){
    const t=data[sec]?.find(x=>x.id===id);
    if(!t)return;
    const c=['todo','inprog','done'];
    t.status=c[(c.indexOf(t.status||'todo')+1)%3];
    save(data);render();return;
  }
  if(a==='toggleStep'){
    const tid=e.currentTarget.dataset.tid, sid=e.currentTarget.dataset.sid;
    const t=data[sec]?.find(x=>x.id===tid);
    const s=t?.steps?.find(x=>x.id===sid);
    if(s){s.done=!s.done;save(data);render()}return;
  }
  if(a==='resetDaily'){
    if(!confirm('Сбросить все задачи дня?'))return;
    data.daily.forEach(t=>t.done=false);
    save(data);render();return;
  }
  if(a==='toggleArchive'){
    data.showArchive[sec]=!data.showArchive[sec];
    save(data);render();return;
  }
}

document.getElementById('modalCancel').addEventListener('click',closeModal);
document.getElementById('modalSave').addEventListener('click',saveModal);
document.getElementById('modalBackdrop').addEventListener('click',e=>{
  if(e.target===document.getElementById('modalBackdrop'))closeModal();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&e.ctrlKey)saveModal();
});
</script>
</body>
</html>
